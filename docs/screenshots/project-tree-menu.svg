<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" font-family="'SF Pro Text', 'Segoe UI', system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Project tree background -->
  <rect width="220" height="420" fill="#1E1F22"/>
  <text x="12" y="22" fill="#BCBEC4" font-size="12" font-weight="bold">Project</text>

  <!-- Tree items -->
  <text x="12" y="50" fill="#808080" font-size="12">▼ src</text>
  <text x="32" y="72" fill="#808080" font-size="12">▼ main</text>
  <text x="52" y="94" fill="#808080" font-size="12">▼ java</text>

  <!-- Selected file -->
  <rect x="4" y="100" width="212" height="22" rx="3" fill="#2E436E"/>
  <text x="72" y="116" fill="#BCBEC4" font-size="12">📄 Main.java</text>

  <text x="72" y="138" fill="#808080" font-size="12">📄 Utils.java</text>
  <text x="52" y="160" fill="#808080" font-size="12">▶ resources</text>
  <text x="32" y="182" fill="#808080" font-size="12">▼ test</text>
  <text x="52" y="204" fill="#808080" font-size="12">▼ java</text>
  <text x="72" y="226" fill="#808080" font-size="12">📄 MainTest.java</text>

  <!-- Context menu -->
  <rect x="160" y="90" width="300" height="310" rx="8" fill="#2B2D30" stroke="#3C3F41" stroke-width="1" filter="url(#shadow)"/>

  <!-- Regular items -->
  <text x="180" y="118" fill="#808080" font-size="12">New</text>
  <text x="180" y="142" fill="#808080" font-size="12">Cut</text>
  <text x="180" y="166" fill="#808080" font-size="12">Copy</text>
  <text x="180" y="190" fill="#808080" font-size="12">Copy Path/Reference...</text>

  <!-- Separator -->
  <line x1="170" y1="200" x2="450" y2="200" stroke="#3C3F41" stroke-width="1"/>

  <text x="180" y="220" fill="#808080" font-size="12">Refactor</text>
  <text x="180" y="244" fill="#808080" font-size="12">Open In</text>

  <!-- Separator -->
  <line x1="170" y1="255" x2="450" y2="255" stroke="#3C3F41" stroke-width="1"/>

  <!-- Claude Code submenu - highlighted -->
  <rect x="165" y="262" width="290" height="26" rx="4" fill="#2E436E"/>

  <!-- Claude icon -->
  <circle cx="182" cy="275" r="8" fill="#D97757"/>
  <text x="178" y="279" fill="#1E1F22" font-size="10" font-weight="bold">C</text>

  <text x="198" y="279" fill="#BCBEC4" font-size="13" font-weight="500">Claude Code</text>
  <text x="432" y="279" fill="#808080" font-size="11">▶</text>

  <!-- Submenu -->
  <rect x="250" y="290" width="260" height="105" rx="8" fill="#2B2D30" stroke="#3C3F41" stroke-width="1" filter="url(#shadow)"/>

  <rect x="255" y="298" width="250" height="26" rx="4" fill="#2E436E"/>
  <text x="270" y="315" fill="#BCBEC4" font-size="12.5">Explain with Claude</text>

  <text x="270" y="343" fill="#BCBEC4" font-size="12.5">Generate Tests with Claude</text>

  <text x="270" y="371" fill="#BCBEC4" font-size="12.5">Refactor with Claude</text>

  <!-- More items below Claude -->
  <line x1="170" y1="295" x2="240" y2="295" stroke="#3C3F41" stroke-width="1"/>
  <text x="180" y="315" fill="#808080" font-size="12">Delete...</text>
</svg>