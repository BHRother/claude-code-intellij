<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" font-family="'SF Pro Text', 'Segoe UI', system-ui, sans-serif" font-size="12">
  <!-- Settings dialog background -->
  <rect width="640" height="500" fill="#2B2D30"/>

  <!-- Title bar -->
  <rect width="640" height="32" fill="#3C3F41"/>
  <text x="16" y="21" fill="#BCBEC4" font-size="13" font-weight="500">Settings — Claude Code</text>

  <!-- ═══════ General group ═══════ -->
  <text x="20" y="60" fill="#BCBEC4" font-size="12" font-weight="bold">General</text>
  <line x1="20" y1="68" x2="620" y2="68" stroke="#3C3F41" stroke-width="1"/>

  <!-- Claude CLI path -->
  <text x="20" y="92" fill="#BCBEC4" font-size="11.5">Claude CLI path:</text>
  <rect x="160" y="80" width="300" height="22" rx="3" fill="#1E1F22" stroke="#3C3F41" stroke-width="0.5"/>
  <text x="166" y="95" fill="#BCBEC4" font-size="11" font-family="'JetBrains Mono', monospace">claude</text>
  <rect x="468" y="80" width="76" height="22" rx="3" fill="#3C3F41" stroke="#5C5F61" stroke-width="0.5"/>
  <text x="481" y="95" fill="#BCBEC4" font-size="11">Auto-detect</text>
  <rect x="552" y="80" width="60" height="22" rx="3" fill="#3C3F41" stroke="#5C5F61" stroke-width="0.5"/>
  <text x="566" y="95" fill="#BCBEC4" font-size="11">Browse…</text>

  <text x="160" y="118" fill="#808080" font-size="10.5">Bare name (resolved via PATH / npm) or an absolute path. On Windows, set</text>
  <text x="160" y="130" fill="#808080" font-size="10.5">the absolute path to <tspan font-family="'JetBrains Mono', monospace">claude.cmd</tspan>.</text>

  <!-- Model dropdown -->
  <text x="20" y="160" fill="#BCBEC4" font-size="11.5">Model:</text>
  <rect x="160" y="148" width="300" height="22" rx="3" fill="#1E1F22" stroke="#3C3F41" stroke-width="0.5"/>
  <text x="166" y="163" fill="#BCBEC4" font-size="11">Opus 4.7</text>
  <text x="446" y="163" fill="#808080" font-size="11">▾</text>

  <text x="160" y="184" fill="#808080" font-size="10.5">Leave empty for CLI default. Type any model ID — known IDs display as short</text>
  <text x="160" y="196" fill="#808080" font-size="10.5">names (Opus 4.7, Sonnet 4.6, Haiku 4.5, …).</text>

  <!-- Font size -->
  <text x="20" y="218" fill="#BCBEC4" font-size="11.5">Font size:</text>
  <rect x="160" y="206" width="60" height="22" rx="3" fill="#1E1F22" stroke="#3C3F41" stroke-width="0.5"/>
  <text x="166" y="221" fill="#BCBEC4" font-size="11">13</text>

  <!-- Max sessions -->
  <text x="20" y="246" fill="#BCBEC4" font-size="11.5">Max sessions:</text>
  <rect x="160" y="234" width="60" height="22" rx="3" fill="#1E1F22" stroke="#3C3F41" stroke-width="0.5"/>
  <text x="166" y="249" fill="#BCBEC4" font-size="11">10</text>

  <!-- ═══════ Permissions group ═══════ -->
  <text x="20" y="290" fill="#BCBEC4" font-size="12" font-weight="bold">Permissions</text>
  <line x1="20" y1="298" x2="620" y2="298" stroke="#3C3F41" stroke-width="1"/>

  <text x="20" y="322" fill="#BCBEC4" font-size="11.5">Permission mode:</text>
  <rect x="160" y="310" width="300" height="22" rx="3" fill="#1E1F22" stroke="#3C3F41" stroke-width="0.5"/>
  <text x="166" y="325" fill="#BCBEC4" font-size="11">Content Only</text>
  <text x="446" y="325" fill="#808080" font-size="11">▾</text>

  <text x="160" y="346" fill="#808080" font-size="10.5"><tspan font-weight="bold" fill="#BCBEC4">Plan</tspan>: read-only — Read/Grep/Glob only, useful for exploratory chats.</text>
  <text x="160" y="360" fill="#808080" font-size="10.5"><tspan font-weight="bold" fill="#BCBEC4">Content Only</tspan> (recommended): file writes/edits go through, shell blocked.</text>
  <text x="160" y="374" fill="#808080" font-size="10.5"><tspan font-weight="bold" fill="#BCBEC4">Unrestricted</tspan>: Claude can run any tool including shell commands.</text>
  <text x="160" y="388" fill="#808080" font-size="10.5">Maps to <tspan font-family="'JetBrains Mono', monospace">--permission-mode</tspan> (plan / acceptEdits / bypassPermissions).</text>

  <!-- ═══════ Context group ═══════ -->
  <text x="20" y="426" fill="#BCBEC4" font-size="12" font-weight="bold">Context</text>
  <line x1="20" y1="434" x2="620" y2="434" stroke="#3C3F41" stroke-width="1"/>

  <rect x="20" y="448" width="12" height="12" rx="2" fill="#3C3F41" stroke="#5C5F61" stroke-width="0.5"/>
  <text x="28" y="458" fill="#1E1F22" font-size="10">✓</text>
  <text x="40" y="459" fill="#BCBEC4" font-size="11.5">Send selected code as context</text>
  <text x="40" y="475" fill="#808080" font-size="10.5">When using right-click actions, send the selected code to Claude</text>
</svg>
