<svg xmlns="http://www.w3.org/2000/svg" width="540" height="320" font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace" font-size="12">
  <!-- Chat-area background -->
  <rect width="540" height="320" fill="#1E1F22"/>

  <!-- Preceding user message (context) -->
  <rect x="10" y="10" width="520" height="32" rx="4" fill="#2B2D30"/>
  <text x="18" y="30" fill="#6897BB" font-size="12">Run ./gradlew buildPlugin</text>

  <!-- Tool use line: Bash attempt -->
  <text x="18" y="60" fill="#D97757" font-size="12" font-style="italic">
    <tspan fill="#D9B263">⏺</tspan> Bash(./gradlew buildPlugin)
  </text>
  <text x="34" y="76" fill="#FF6B68" font-size="11">✗ failed</text>

  <!-- ───────── Permission-blocked banner ───────── -->
  <rect x="10" y="92" width="520" height="216" rx="4" fill="#2B2D30"/>
  <!-- Left accent border -->
  <rect x="10" y="92" width="3" height="216" fill="#D9B263"/>

  <text x="24" y="112" fill="#D9B263" font-size="12">
    <tspan font-size="13">⚠</tspan> A tool (<tspan font-style="italic">Bash</tspan>) was blocked by your
  </text>
  <text x="24" y="128" fill="#D9B263" font-size="12">current permission mode (<tspan font-weight="bold">Content Only</tspan>).</text>

  <text x="24" y="150" fill="#808080" font-size="11">Attempted:</text>
  <rect x="84" y="139" width="232" height="16" rx="3" fill="#1E1F22"/>
  <text x="90" y="151" fill="#BCBEC4" font-size="11">./gradlew buildPlugin</text>

  <text x="24" y="176" fill="#BCBEC4" font-size="11.5">Choose one:</text>

  <!-- Bullets -->
  <text x="30" y="196" fill="#BCBEC4" font-size="11.5">•</text>
  <text x="44" y="196" fill="#6897BB" font-size="11.5" text-decoration="underline">Allow this exact bash</text>

  <text x="30" y="216" fill="#BCBEC4" font-size="11.5">•</text>
  <text x="44" y="216" fill="#6897BB" font-size="11.5" text-decoration="underline">Allow all <tspan font-family="'JetBrains Mono'">Bash</tspan> calls</text>

  <text x="30" y="236" fill="#BCBEC4" font-size="11.5">•</text>
  <text x="44" y="236" fill="#6897BB" font-size="11.5" text-decoration="underline">Switch to Unrestricted mode</text>

  <!-- Footer note -->
  <text x="24" y="266" fill="#707070" font-size="10.5" font-style="italic">Allow-list edits write to</text>
  <text x="146" y="266" fill="#A8A8A8" font-size="10.5">.claude/settings.local.json</text>
  <text x="306" y="266" fill="#707070" font-size="10.5" font-style="italic">in this project;</text>
  <text x="24" y="282" fill="#707070" font-size="10.5" font-style="italic">mode change is per-session via the permission chip.</text>

  <!-- After click: replaces in place (small annotation) -->
  <text x="24" y="302" fill="#6A8759" font-size="10.5" font-style="italic">Picking any option replaces the banner with a confirmation —</text>
  <text x="24" y="316" fill="#6A8759" font-size="10.5" font-style="italic">the action links can't be re-clicked.</text>
</svg>
