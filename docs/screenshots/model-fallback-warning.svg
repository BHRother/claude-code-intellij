<svg xmlns="http://www.w3.org/2000/svg" width="540" height="220" font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace" font-size="12">
  <!-- Chat-area background -->
  <rect width="540" height="220" fill="#1E1F22"/>

  <!-- Preceding context: a brief user prompt -->
  <rect x="10" y="10" width="520" height="32" rx="4" fill="#2B2D30"/>
  <text x="18" y="30" fill="#6897BB" font-size="12">Summarize this PR for me.</text>

  <!-- Warning banner: model diverged -->
  <rect x="10" y="56" width="520" height="100" rx="4" fill="#2B2D30"/>
  <!-- Left accent stripe -->
  <rect x="10" y="56" width="3" height="100" fill="#D9B263"/>

  <text x="24" y="78" fill="#D9B263" font-size="12">
    <tspan font-size="13">⚠</tspan> Claude responded using <tspan font-weight="bold">Sonnet 4.6</tspan>
  </text>
  <text x="24" y="94" fill="#D9B263" font-size="12">
    (<tspan font-family="'JetBrains Mono', monospace" font-size="11">claude-sonnet-4-6</tspan>) instead of your selected <tspan font-weight="bold">Opus 4.7</tspan>.
  </text>

  <text x="24" y="120" fill="#808080" font-size="11">Likely a rate-limit or quota fallback.</text>
  <text x="24" y="138" fill="#808080" font-size="11">The model dropdown has been updated to reflect the actual model in use.</text>

  <!-- Where the chip updates (small inline preview) -->
  <text x="24" y="180" fill="#606060" font-size="10.5" font-style="italic">Chip below input now reads:</text>
  <text x="180" y="180" fill="#BCBEC4" font-size="11">Sonnet 4.6</text>
  <text x="232" y="180" fill="#808080" font-size="11">▾</text>

  <text x="24" y="202" fill="#606060" font-size="10.5" font-style="italic">One warning per (selected, actual) pair per session — re-pick from the chip to reset.</text>
</svg>
