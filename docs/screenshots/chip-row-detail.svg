<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" font-family="'SF Pro Text', 'Segoe UI', system-ui, sans-serif" font-size="12">
  <!-- Background -->
  <rect width="640" height="280" fill="#181A1D"/>

  <!-- Input area (auto-grow at min 3 lines) -->
  <rect x="40" y="38" width="560" height="64" fill="#1E1F22" stroke="#3C3F41" stroke-width="0.5"/>
  <text x="52" y="60" fill="#BCBEC4" font-size="12" font-family="'JetBrains Mono', monospace">Now add unit tests for the new</text>
  <text x="52" y="78" fill="#BCBEC4" font-size="12" font-family="'JetBrains Mono', monospace">stream-based helper.</text>
  <text x="52" y="96" fill="#808080" font-size="12" font-family="'JetBrains Mono', monospace">▎</text>

  <!-- Chip row -->
  <rect x="40" y="102" width="560" height="32" fill="#1E1F22"/>
  <!-- Model chip -->
  <g>
    <text x="52" y="123" fill="#BCBEC4" font-size="11">Opus 4.7</text>
    <text x="102" y="123" fill="#808080" font-size="11">▾</text>
  </g>
  <!-- Permission chip -->
  <g>
    <text x="124" y="123" fill="#BCBEC4" font-size="11">Content Only</text>
    <text x="202" y="123" fill="#808080" font-size="11">▾</text>
  </g>
  <!-- Debug checkbox -->
  <g>
    <rect x="446" y="112" width="11" height="11" rx="1.5" fill="none" stroke="#606060" stroke-width="1"/>
    <text x="460" y="122" fill="#606060" font-size="11">Debug</text>
  </g>
  <!-- Gear -->
  <g transform="translate(510, 112)" fill="none" stroke="#BCBEC4" stroke-width="1.4">
    <circle cx="6" cy="6" r="2.2"/>
    <path d="M6 1.4v1.6 M6 9v1.6 M1.4 6h1.6 M9 6h1.6 M2.7 2.7l1.1 1.1 M8.2 8.2l1.1 1.1 M2.7 9.3l1.1-1.1 M8.2 3.8l1.1-1.1"/>
  </g>
  <!-- Send button (accent) -->
  <rect x="536" y="108" width="56" height="22" rx="6" fill="#D97757"/>
  <text x="551" y="123" fill="#FFFFFF" font-size="11" font-weight="500">Send</text>

  <!-- Status + hint row -->
  <text x="52" y="156" fill="#808080" font-size="11" font-style="italic">Ready</text>
  <text x="298" y="156" fill="#606060" font-size="10" font-family="'JetBrains Mono', monospace">Enter to send · Shift+Enter for newline · Esc to stop</text>

  <!-- ───────── Annotations ───────── -->
  <!-- 1. Auto-grow -->
  <line x1="38" y1="70" x2="20" y2="70" stroke="#D97757" stroke-width="1"/>
  <text x="8" y="74" fill="#D97757" font-size="10" text-anchor="end">①</text>

  <!-- 2. Model chip -->
  <line x1="82" y1="135" x2="82" y2="180" stroke="#D97757" stroke-width="1"/>
  <text x="82" y="194" fill="#D97757" font-size="10" text-anchor="middle">②</text>

  <!-- 3. Permission chip -->
  <line x1="170" y1="135" x2="170" y2="180" stroke="#D97757" stroke-width="1"/>
  <text x="170" y="194" fill="#D97757" font-size="10" text-anchor="middle">③</text>

  <!-- 4. Debug -->
  <line x1="468" y1="135" x2="468" y2="218" stroke="#D97757" stroke-width="1"/>
  <text x="468" y="232" fill="#D97757" font-size="10" text-anchor="middle">④</text>

  <!-- 5. Gear -->
  <line x1="516" y1="135" x2="516" y2="218" stroke="#D97757" stroke-width="1"/>
  <text x="516" y="232" fill="#D97757" font-size="10" text-anchor="middle">⑤</text>

  <!-- 6. Send -->
  <line x1="564" y1="135" x2="564" y2="244" stroke="#D97757" stroke-width="1"/>
  <text x="564" y="258" fill="#D97757" font-size="10" text-anchor="middle">⑥</text>

  <!-- Legend -->
  <text x="40" y="218" fill="#BCBEC4" font-size="10.5"><tspan fill="#D97757">①</tspan> Auto-grow 3 → 10 lines</text>
  <text x="40" y="232" fill="#BCBEC4" font-size="10.5"><tspan fill="#D97757">②</tspan> Per-session model override</text>
  <text x="40" y="246" fill="#BCBEC4" font-size="10.5"><tspan fill="#D97757">③</tspan> Plan / Content Only / Unrestricted</text>
  <text x="300" y="218" fill="#BCBEC4" font-size="10.5"><tspan fill="#D97757">④</tspan> Show/hide debug log</text>
  <text x="300" y="232" fill="#BCBEC4" font-size="10.5"><tspan fill="#D97757">⑤</tspan> Open plugin Settings</text>
  <text x="300" y="246" fill="#BCBEC4" font-size="10.5"><tspan fill="#D97757">⑥</tspan> Send (turns red Stop while busy)</text>
</svg>
