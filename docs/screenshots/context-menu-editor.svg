<svg xmlns="http://www.w3.org/2000/svg" width="460" height="420" font-family="'SF Pro Text', 'Segoe UI', system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Menu background -->
  <rect x="10" y="10" width="440" height="400" rx="8" fill="#2B2D30" stroke="#3C3F41" stroke-width="1" filter="url(#shadow)"/>

  <!-- Regular menu items (dimmed) -->
  <text x="40" y="40" fill="#808080" font-size="12">Cut</text>
  <text x="40" y="62" fill="#808080" font-size="12">Copy</text>
  <text x="40" y="84" fill="#808080" font-size="12">Paste</text>

  <line x1="20" y1="95" x2="440" y2="95" stroke="#3C3F41" stroke-width="1"/>

  <text x="40" y="115" fill="#808080" font-size="12">Refactor</text>
  <text x="40" y="137" fill="#808080" font-size="12">Go To</text>
  <text x="40" y="159" fill="#808080" font-size="12">Generate…</text>

  <line x1="20" y1="170" x2="440" y2="170" stroke="#3C3F41" stroke-width="1"/>

  <!-- Claude Code submenu - highlighted -->
  <rect x="15" y="178" width="430" height="26" rx="4" fill="#2E436E"/>
  <circle cx="32" cy="191" r="8" fill="#D97757"/>
  <text x="28" y="195" fill="#1E1F22" font-size="10" font-weight="bold">C</text>
  <text x="48" y="195" fill="#BCBEC4" font-size="13" font-weight="500">Claude Code</text>
  <text x="416" y="195" fill="#808080" font-size="11">▶</text>

  <!-- Submenu popup -->
  <rect x="180" y="210" width="270" height="200" rx="8" fill="#2B2D30" stroke="#3C3F41" stroke-width="1" filter="url(#shadow)"/>

  <rect x="185" y="218" width="260" height="26" rx="4" fill="#2E436E"/>
  <text x="200" y="235" fill="#BCBEC4" font-size="12.5">Explain with Claude</text>

  <text x="200" y="263" fill="#BCBEC4" font-size="12.5">Refactor with Claude</text>

  <text x="200" y="291" fill="#BCBEC4" font-size="12.5">Generate Tests with Claude</text>

  <text x="200" y="319" fill="#BCBEC4" font-size="12.5">Fix with Claude</text>

  <line x1="190" y1="328" x2="440" y2="328" stroke="#3C3F41" stroke-width="0.5"/>

  <text x="200" y="349" fill="#BCBEC4" font-size="12.5">Send to Claude…</text>

  <line x1="190" y1="358" x2="440" y2="358" stroke="#3C3F41" stroke-width="0.5"/>

  <!-- Inline edit shortcut hint -->
  <text x="200" y="380" fill="#808080" font-size="11">Inline Edit</text>
  <text x="350" y="380" fill="#606060" font-size="11">⌘⌥K</text>

  <text x="200" y="400" fill="#808080" font-size="10" font-style="italic">Press to edit at the caret without</text>
  <text x="200" y="412" fill="#808080" font-size="10" font-style="italic">leaving the editor.</text>

  <!-- Surrounding (regular) items above menu -->
  <line x1="20" y1="207" x2="170" y2="207" stroke="#3C3F41" stroke-width="1"/>
  <text x="40" y="227" fill="#808080" font-size="12">Folding</text>
</svg>
