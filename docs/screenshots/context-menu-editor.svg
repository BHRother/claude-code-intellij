<svg xmlns="http://www.w3.org/2000/svg" width="420" height="380" font-family="'SF Pro Text', 'Segoe UI', system-ui, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Menu background -->
  <rect x="10" y="10" width="400" height="360" rx="8" fill="#2B2D30" stroke="#3C3F41" stroke-width="1" filter="url(#shadow)"/>

  <!-- Regular menu items (dimmed) -->
  <text x="40" y="40" fill="#808080" font-size="12">Cut</text>
  <text x="40" y="62" fill="#808080" font-size="12">Copy</text>
  <text x="40" y="84" fill="#808080" font-size="12">Paste</text>

  <!-- Separator -->
  <line x1="20" y1="95" x2="400" y2="95" stroke="#3C3F41" stroke-width="1"/>

  <text x="40" y="115" fill="#808080" font-size="12">Refactor</text>
  <text x="40" y="137" fill="#808080" font-size="12">Go To</text>
  <text x="40" y="159" fill="#808080" font-size="12">Generate...</text>

  <!-- Separator -->
  <line x1="20" y1="170" x2="400" y2="170" stroke="#3C3F41" stroke-width="1"/>

  <!-- Claude Code submenu - highlighted -->
  <rect x="15" y="178" width="390" height="26" rx="4" fill="#2E436E"/>

  <!-- Claude icon (simple circle) -->
  <circle cx="32" cy="191" r="8" fill="#D97757"/>
  <text x="28" y="195" fill="#1E1F22" font-size="10" font-weight="bold">C</text>

  <text x="48" y="195" fill="#BCBEC4" font-size="13" font-weight="500">Claude Code</text>
  <text x="376" y="195" fill="#808080" font-size="11">▶</text>

  <!-- Submenu popup -->
  <rect x="140" y="210" width="260" height="155" rx="8" fill="#2B2D30" stroke="#3C3F41" stroke-width="1" filter="url(#shadow)"/>

  <!-- Submenu items -->
  <rect x="145" y="218" width="250" height="26" rx="4" fill="#2E436E"/>
  <text x="160" y="235" fill="#BCBEC4" font-size="12.5">Explain with Claude</text>

  <text x="160" y="263" fill="#BCBEC4" font-size="12.5">Refactor with Claude</text>

  <text x="160" y="291" fill="#BCBEC4" font-size="12.5">Generate Tests with Claude</text>

  <text x="160" y="319" fill="#BCBEC4" font-size="12.5">Fix with Claude</text>

  <!-- Separator -->
  <line x1="20" y1="207" x2="130" y2="207" stroke="#3C3F41" stroke-width="1"/>

  <text x="40" y="227" fill="#808080" font-size="12">Folding</text>
</svg>