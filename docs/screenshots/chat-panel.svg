<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace" font-size="12">
  <defs>
    <filter id="shadow" x="-3%" y="-2%" width="106%" height="106%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Panel background -->
  <rect width="480" height="660" fill="#1E1F22"/>

  <!-- Title bar with tabs -->
  <rect width="480" height="32" fill="#2B2D30"/>
  <text x="12" y="21" fill="#BCBEC4" font-size="12" font-weight="bold">Claude Code</text>
  <!-- Active tab -->
  <rect x="110" y="4" width="130" height="24" rx="4" fill="#1E1F22"/>
  <text x="122" y="20" fill="#BCBEC4" font-size="11">Refactor streams</text>
  <text x="228" y="20" fill="#808080" font-size="11">×</text>
  <!-- + button -->
  <rect x="250" y="6" width="20" height="20" rx="4" fill="#3C3F41"/>
  <text x="255" y="20" fill="#BCBEC4" font-size="14">+</text>

  <!-- ───────── Chat output ───────── -->
  <!-- User message -->
  <rect x="8" y="46" width="464" height="38" rx="4" fill="#2B2D30"/>
  <text x="16" y="63" fill="#6897BB" font-size="12">Refactor this method to use streams</text>
  <text x="360" y="63" fill="#6897BB" font-size="10" text-decoration="underline">[copy]</text>
  <text x="398" y="63" fill="#6897BB" font-size="10" text-decoration="underline">[edit]</text>

  <!-- Tool: Read -->
  <text x="16" y="108" fill="#D97757" font-size="12" font-style="italic">
    <tspan fill="#6897BB">⏺</tspan> Read(src/Main.java)
  </text>
  <text x="32" y="124" fill="#6A8759" font-size="11">✓</text>

  <!-- Tool: Edit -->
  <text x="16" y="148" fill="#D97757" font-size="12" font-style="italic">
    <tspan fill="#D9B263">⏺</tspan> Edit(src/Main.java)
  </text>
  <text x="32" y="164" fill="#808080" font-size="11">⎿ +5 −8 lines</text>

  <!-- Claude reply -->
  <text x="16" y="194" fill="#BCBEC4" font-size="12">I've refactored the method to use Java streams.</text>
  <text x="16" y="212" fill="#BCBEC4" font-size="12">Key changes:</text>

  <!-- Code block with [copy] [apply] -->
  <rect x="12" y="226" width="456" height="118" rx="4" fill="#2B2D30"/>
  <text x="20" y="244" fill="#808080" font-size="11">java</text>
  <text x="376" y="244" fill="#6897BB" font-size="10" text-decoration="underline">[copy]</text>
  <text x="416" y="244" fill="#6A8759" font-size="10" text-decoration="underline">[apply]</text>

  <text x="20" y="266" fill="#CC7832" font-size="11.5">public</text>
  <text x="64" y="266" fill="#BCBEC4" font-size="11.5"> List&lt;String&gt; </text>
  <text x="162" y="266" fill="#BCBEC4" font-size="11.5">getNames() {</text>
  <text x="20" y="284" fill="#CC7832" font-size="11.5">    return</text>
  <text x="82" y="284" fill="#BCBEC4" font-size="11.5"> items.stream()</text>
  <text x="20" y="302" fill="#BCBEC4" font-size="11.5">        .map(Item::getName)</text>
  <text x="20" y="320" fill="#BCBEC4" font-size="11.5">        .collect(Collectors.toList());</text>
  <text x="20" y="338" fill="#BCBEC4" font-size="11.5">}</text>

  <!-- Cost (now inline in status, but show summary) -->
  <text x="16" y="368" fill="#808080" font-size="11" font-style="italic">Done · 2 turns · $0.0142</text>

  <!-- ───────── Bottom: input + chip row + status ───────── -->
  <!-- Separator above input -->
  <line x1="0" y1="382" x2="480" y2="382" stroke="#3C3F41" stroke-width="1"/>

  <!-- Input area (3 lines, auto-grow target — sample text typed) -->
  <rect x="0" y="382" width="480" height="64" fill="#1E1F22"/>
  <text x="12" y="402" fill="#BCBEC4" font-size="12">Now add unit tests for the new</text>
  <text x="12" y="420" fill="#BCBEC4" font-size="12">stream-based helper.</text>
  <text x="12" y="438" fill="#808080" font-size="12">▎</text>

  <!-- ───────── Chip row ───────── -->
  <rect x="0" y="448" width="480" height="30" fill="#1E1F22"/>
  <!-- Model chip -->
  <g>
    <text x="12" y="468" fill="#BCBEC4" font-size="11">Opus 4.7</text>
    <text x="62" y="468" fill="#808080" font-size="11">▾</text>
  </g>
  <!-- Permission chip -->
  <g>
    <text x="84" y="468" fill="#BCBEC4" font-size="11">Content Only</text>
    <text x="162" y="468" fill="#808080" font-size="11">▾</text>
  </g>
  <!-- Debug checkbox -->
  <g>
    <rect x="306" y="458" width="11" height="11" rx="1.5" fill="none" stroke="#606060" stroke-width="1"/>
    <text x="320" y="468" fill="#606060" font-size="11">Debug</text>
  </g>
  <!-- Gear icon -->
  <g transform="translate(376, 458)" fill="none" stroke="#BCBEC4" stroke-width="1.4">
    <circle cx="6" cy="6" r="2.2"/>
    <path d="M6 1.4v1.6 M6 9v1.6 M1.4 6h1.6 M9 6h1.6 M2.7 2.7l1.1 1.1 M8.2 8.2l1.1 1.1 M2.7 9.3l1.1-1.1 M8.2 3.8l1.1-1.1"/>
  </g>
  <!-- Send button (accent) -->
  <rect x="406" y="453" width="60" height="22" rx="6" fill="#D97757"/>
  <text x="424" y="468" fill="#FFFFFF" font-size="11" font-weight="500">Send</text>

  <!-- ───────── Status + hint row ───────── -->
  <text x="12" y="496" fill="#808080" font-size="11" font-style="italic">Ready</text>
  <text x="166" y="496" fill="#606060" font-size="10">Enter to send · Shift+Enter for newline · Esc to stop</text>

  <!-- ───────── Debug area (collapsed footer with thin sample) ───────── -->
  <rect x="0" y="512" width="480" height="148" fill="#151518"/>
  <text x="10" y="528" fill="#707070" font-size="9.5">claude-session-a1b2: Resolved claude path: /usr/local/bin/claude</text>
  <text x="10" y="542" fill="#707070" font-size="9.5">claude-session-a1b2: Command: claude -p --output-format stream-json --verbose</text>
  <text x="10" y="556" fill="#707070" font-size="9.5">    --model claude-opus-4-7 --permission-mode acceptEdits</text>
  <text x="10" y="570" fill="#707070" font-size="9.5">claude-session-a1b2: json[1]: {"type":"system","subtype":"init","model":"claude-opus..."}</text>
  <text x="10" y="584" fill="#707070" font-size="9.5">claude-session-a1b2: json[3]: {"type":"assistant","message":{"content":[...]}}</text>
  <text x="10" y="598" fill="#707070" font-size="9.5">claude-session-a1b2: json[5]: {"type":"tool_use","name":"Read","input":{...}}</text>
  <text x="10" y="612" fill="#707070" font-size="9.5">claude-session-a1b2: Stream closed after 9 lines</text>
  <text x="10" y="626" fill="#707070" font-size="9.5">claude-session-a1b2: Process exited: finished=true code=0</text>
  <text x="10" y="640" fill="#707070" font-size="9.5">claude-session-a1b2: Completed in 3.2s | cost: $0.0142 | 2 turns</text>
</svg>
