<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace" font-size="12">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Editor background -->
  <rect width="560" height="380" fill="#1E1F22"/>

  <!-- Gutter -->
  <rect width="40" height="380" fill="#181A1D"/>
  <text x="14" y="32" fill="#606060" font-size="11">1</text>
  <text x="14" y="50" fill="#606060" font-size="11">2</text>
  <text x="14" y="68" fill="#606060" font-size="11">3</text>
  <text x="14" y="86" fill="#606060" font-size="11">4</text>
  <text x="14" y="104" fill="#606060" font-size="11">5</text>
  <text x="14" y="122" fill="#606060" font-size="11">6</text>
  <text x="14" y="140" fill="#606060" font-size="11">7</text>
  <text x="14" y="158" fill="#606060" font-size="11">8</text>
  <text x="14" y="176" fill="#606060" font-size="11">9</text>

  <!-- Code lines (sample Kotlin function) -->
  <text x="48" y="32" fill="#CC7832" font-size="12">fun </text>
  <text x="76" y="32" fill="#FFC66D" font-size="12">getNames</text>
  <text x="135" y="32" fill="#BCBEC4" font-size="12">(): </text>
  <text x="158" y="32" fill="#A9B7C6" font-size="12">List</text>
  <text x="188" y="32" fill="#BCBEC4" font-size="12">&lt;</text>
  <text x="196" y="32" fill="#A9B7C6" font-size="12">String</text>
  <text x="240" y="32" fill="#BCBEC4" font-size="12">&gt; {</text>

  <text x="64" y="50" fill="#CC7832" font-size="12">val</text>
  <text x="88" y="50" fill="#BCBEC4" font-size="12"> result = </text>
  <text x="166" y="50" fill="#A9B7C6" font-size="12">mutableListOf</text>
  <text x="260" y="50" fill="#BCBEC4" font-size="12">&lt;</text>
  <text x="268" y="50" fill="#A9B7C6" font-size="12">String</text>
  <text x="312" y="50" fill="#BCBEC4" font-size="12">&gt;()</text>

  <text x="64" y="68" fill="#CC7832" font-size="12">for</text>
  <text x="88" y="68" fill="#BCBEC4" font-size="12"> (item </text>
  <text x="138" y="68" fill="#CC7832" font-size="12">in</text>
  <text x="154" y="68" fill="#BCBEC4" font-size="12"> items) {</text>

  <!-- Selected range highlight (lines 4-7) -->
  <rect x="40" y="74" width="520" height="84" fill="#2E436E" fill-opacity="0.45"/>
  <text x="80" y="86" fill="#BCBEC4" font-size="12">result.add(item.name)</text>
  <text x="64" y="104" fill="#BCBEC4" font-size="12">}</text>
  <text x="64" y="122" fill="#CC7832" font-size="12">return</text>
  <text x="112" y="122" fill="#BCBEC4" font-size="12"> result</text>
  <text x="48" y="140" fill="#BCBEC4" font-size="12">}</text>

  <text x="48" y="176" fill="#A9B7C6" font-size="12">// other code...</text>

  <!-- Inline edit floating prompt -->
  <g filter="url(#shadow)">
    <rect x="60" y="190" width="460" height="120" rx="8" fill="#2B2D30" stroke="#3C3F41" stroke-width="1"/>

    <!-- Title row -->
    <circle cx="80" cy="210" r="7" fill="#D97757"/>
    <text x="76" y="214" fill="#1E1F22" font-size="9" font-weight="bold">C</text>
    <text x="94" y="214" fill="#BCBEC4" font-size="12" font-weight="bold" font-family="'SF Pro Text', system-ui, sans-serif">Inline Edit with Claude</text>
    <text x="490" y="214" fill="#606060" font-size="11" font-family="'SF Pro Text', system-ui, sans-serif">⌘⌥K</text>

    <!-- Input -->
    <rect x="72" y="226" width="380" height="46" rx="4" fill="#1E1F22" stroke="#3C3F41" stroke-width="0.5"/>
    <text x="80" y="245" fill="#BCBEC4" font-size="12">Refactor this to use map { … } instead</text>
    <text x="80" y="262" fill="#BCBEC4" font-size="12">of the mutable list.</text>

    <!-- Submit button -->
    <rect x="460" y="226" width="48" height="46" rx="4" fill="#D97757"/>
    <text x="468" y="254" fill="#FFFFFF" font-size="11" font-weight="500" font-family="'SF Pro Text', system-ui, sans-serif">Apply</text>

    <!-- Footer hint -->
    <text x="72" y="294" fill="#808080" font-size="10.5" font-family="'SF Pro Text', system-ui, sans-serif">Edits the highlighted range in place — diff preview before commit.</text>
  </g>

  <!-- Status caption -->
  <text x="60" y="340" fill="#606060" font-size="10.5" font-style="italic" font-family="'SF Pro Text', system-ui, sans-serif">Trigger: ⌘⌥K (macOS) / Ctrl+Alt+K (Linux / Windows), or Floating Toolbar.</text>
  <text x="60" y="356" fill="#606060" font-size="10.5" font-style="italic" font-family="'SF Pro Text', system-ui, sans-serif">Operates on the current selection (or caret line if no selection).</text>
</svg>
